name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-26
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the version; this installs it.
      - name: Set up Rust
        shell: bash
        run: rustup toolchain install

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev

      # One universal app for Apple silicon and Intel.
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/ytfast \
            target/aarch64-apple-darwin/release/ytfast \
            target/x86_64-apple-darwin/release/ytfast
          packaging/macos/bundle.sh dist/ytfast dist/ytfast.app "${RELEASE_VERSION}"
          ditto -c -k --sequesterRsrc --keepParent dist/ytfast.app ytfast-macos.zip

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ytfast.exe README.md LICENSE dist/
          7z a ytfast-${{ matrix.name }}.zip ./dist/*

      - name: Build Linux app
        if: runner.os == 'Linux'
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist/ytfast
          cp target/${{ matrix.target }}/release/ytfast README.md LICENSE dist/ytfast/
          tar -czf ytfast-${{ matrix.name }}.tar.gz -C dist ytfast

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ytfast-*.zip
            ytfast-*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute checksum
        run: echo "ASSET_SHA256=$(sha256sum ytfast-macos.zip | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ytfast-macos.zip
            ytfast-windows-x86_64.zip
            ytfast-linux-x86_64.tar.gz

      - name: Update Homebrew tap
        env:
          TAP_REPO: mateusbadalotti/homebrew-tap
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "Missing HOMEBREW_TAP_GITHUB_TOKEN secret."
            exit 1
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          TAP_DEFAULT_BRANCH="$(git -C tap remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          if [ -z "$TAP_DEFAULT_BRANCH" ]; then
            TAP_DEFAULT_BRANCH=main
            git -C tap checkout -b "$TAP_DEFAULT_BRANCH"
          else
            git -C tap checkout "$TAP_DEFAULT_BRANCH"
          fi
          mkdir -p tap/Casks

          VERSION="${RELEASE_VERSION}"
          cat > tap/Casks/ytfast.rb <<RUBY
          cask "ytfast" do
            version "${VERSION}"
            sha256 "${ASSET_SHA256}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/ytfast-macos.zip"
            name "ytfast"
            desc "Native YouTube Music client"
            homepage "https://github.com/mateusbadalotti/ytfast"

            auto_updates false
            depends_on macos: :monterey
            depends_on formula: "deno"

            app "ytfast.app"
          end
          RUBY

          cd tap
          git add Casks/ytfast.rb
          git commit -m "Update ytfast to ${VERSION}" || echo "No changes to commit."
          git push -u origin "$TAP_DEFAULT_BRANCH"
